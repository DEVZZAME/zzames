name: Deploy To EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      DATABASE_ENABLED: ${{ secrets.DATABASE_ENABLED }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        run: |
          set -eu
          [ -n "${EC2_HOST}" ] || { echo "EC2_HOST is empty"; exit 1; }
          [ -n "${EC2_PORT}" ] || { echo "EC2_PORT is empty"; exit 1; }
          [ -n "${EC2_USER}" ] || { echo "EC2_USER is empty"; exit 1; }
          [ -n "${EC2_SSH_KEY}" ] || { echo "EC2_SSH_KEY is empty"; exit 1; }
          [ -n "${EC2_APP_DIR}" ] || { echo "EC2_APP_DIR is empty"; exit 1; }
          [ -n "${DATABASE_ENABLED}" ] || { echo "DATABASE_ENABLED is empty"; exit 1; }
          [ -n "${DATABASE_URL}" ] || { echo "DATABASE_URL is empty"; exit 1; }
          [ -n "${NEXTAUTH_SECRET}" ] || { echo "NEXTAUTH_SECRET is empty"; exit 1; }
          [ -n "${NEXTAUTH_URL}" ] || { echo "NEXTAUTH_URL is empty"; exit 1; }
          [ -n "${ADMIN_EMAIL}" ] || { echo "ADMIN_EMAIL is empty"; exit 1; }
          [ -n "${ADMIN_PASSWORD}" ] || { echo "ADMIN_PASSWORD is empty"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.EC2_APP_DIR }}
          DATABASE_ENABLED: ${{ env.DATABASE_ENABLED }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          port: ${{ env.EC2_PORT }}
          envs: APP_DIR,DATABASE_ENABLED,DATABASE_URL,NEXTAUTH_SECRET,NEXTAUTH_URL,ADMIN_EMAIL,ADMIN_PASSWORD
          script: |
            set -eu
            cd "$APP_DIR"

            cat > .env.local <<EOF
            DATABASE_ENABLED="$DATABASE_ENABLED"
            DATABASE_URL="$DATABASE_URL"
            NEXTAUTH_SECRET="$NEXTAUTH_SECRET"
            NEXTAUTH_URL="$NEXTAUTH_URL"
            ADMIN_EMAIL="$ADMIN_EMAIL"
            ADMIN_PASSWORD="$ADMIN_PASSWORD"
            EOF

            bash scripts/deploy-remote.sh
